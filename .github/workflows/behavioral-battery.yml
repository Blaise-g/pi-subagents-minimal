name: behavioral-battery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: low-sweep plans 4 trials/7 children; full plans 36/63
        required: true
        type: choice
        options: [low-sweep, full]
      records:
        description: Repository-relative scored records JSON (required to certify full)
        required: false
        type: string
  push:
    tags: ["v*"]
    paths:
      - agents/investigation.md
      - test/behavioral/**
      - tools/behavioral-battery.ts
      - src/runtime.ts
      - package.json

jobs:
  frozen-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install
      - run: bun test test/behavioral-battery.test.ts

  provider-plan:
    needs: frozen-oracles
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.mode == 'low-sweep' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Generate immutable execution plan
        run: |
          if [[ '${{ github.event_name }}' == schedule || '${{ inputs.mode }}' == low-sweep ]]; then
            bun tools/behavioral-battery.ts plan artifacts/behavioral/plan.json --thinking=low --sweep
          else
            bun tools/behavioral-battery.ts plan artifacts/behavioral/plan.json
          fi
      - name: Verify scored full-matrix evidence
        if: ${{ inputs.records != '' }}
        run: bun tools/behavioral-battery.ts verify '${{ inputs.records }}'
      - name: Require evidence for blocking full matrix
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' }}
        run: test -n '${{ inputs.records }}'
      - uses: actions/upload-artifact@v4
        with:
          name: behavioral-battery-plan
          path: artifacts/behavioral/plan.json
