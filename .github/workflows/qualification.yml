name: qualification

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Deterministic parent-context budgets
        run: bun run budget:test
      - run: bun test

  packed-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22.19.0, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun test test/packed.test.ts
      - name: Supported-platform Git semantics and process safety
        run: bun test test/git-boundary.test.ts test/git-diff.test.ts
      - name: Generate package digest
        shell: bash
        run: |
          npm pack --json > pack.json
          node -e "const fs=require('fs'),c=require('crypto'),p=JSON.parse(fs.readFileSync('pack.json')); const r=Array.isArray(p)?p[0]:Object.values(p)[0]; console.log(c.createHash('sha256').update(fs.readFileSync(r.filename)).digest('hex'))" > package.sha256
          grep -E '^[0-9a-f]{64}$' package.sha256

  packed-pi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi: [0.84.3, latest-0.84]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - name: Select supported Pi
        shell: bash
        run: |
          if [ '${{ matrix.pi }}' = latest-0.84 ]; then
            PI_VERSION=$(npm view @earendil-works/pi-coding-agent versions --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).filter(v=>/^0\\.84\\.\\d+$/.test(v)).at(-1)))")
          else PI_VERSION='${{ matrix.pi }}'; fi
          echo "PI_VERSION=$PI_VERSION" >> "$GITHUB_ENV"
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-ai@${PI_VERSION} @earendil-works/pi-coding-agent@${PI_VERSION} typebox@1.3.7 typescript@5.9.3 @types/node@22.19.19 @types/bun@1.3.10
      - run: bun test test/packed.test.ts
      - run: bun run typecheck
      - name: Fresh local candidate pi install
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TARBALL=$(npm pack --silent)
          mkdir fresh package-root pi-home
          tar -xzf "$TARBALL" -C package-root
          PACKAGE_ROOT="$PWD/package-root/package"
          cd fresh
          HOME="$GITHUB_WORKSPACE/pi-home" "$GITHUB_WORKSPACE/node_modules/.bin/pi" install -l "$PACKAGE_ROOT"
          node -e 'const fs=require("fs"),path=require("path"),file=path.resolve(".pi/settings.json"),p=JSON.parse(fs.readFileSync(file)),installed=fs.realpathSync(path.resolve(path.dirname(file),p.packages[0])); if(p.packages.length!==1||installed!==fs.realpathSync(process.argv[1])) process.exit(1)' "$PACKAGE_ROOT"
          cd "$GITHUB_WORKSPACE"
          bun tools/release.ts smoke "$PACKAGE_ROOT/src/index.ts"
          node -e 'const p=require(process.argv[1]); if(p.version!==process.argv[2]||p.pi.extensions.length!==1) process.exit(1)' "$PACKAGE_ROOT/package.json" "$PACKAGE_VERSION"
